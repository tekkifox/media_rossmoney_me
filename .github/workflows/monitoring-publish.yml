name: Build and Publish Monitoring Images

on:
  push:
    branches:
      - main
    paths:
      - 'monitoring/**'
      - '.github/workflows/monitoring-publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dashboard
            context: ./monitoring/dashboard
            file: ./monitoring/dashboard/Dockerfile
          - name: lynis-report-converter
            context: ./monitoring/lynis
            file: ./monitoring/lynis/Dockerfile
          - name: trivy
            context: ./monitoring/trivy
            file: ./monitoring/trivy/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/monitoring-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Portainer webhooks
        if: ${{ env.PORTAINER_WEBHOOK_URLS != '' }}
        env:
          PORTAINER_WEBHOOK_URLS: ${{ vars.PORTAINER_WEBHOOK_URLS }}
        run: |
          # Normalise comma and newline separators to comma-only.
          urls="$(printf '%s' "$PORTAINER_WEBHOOK_URLS" | tr '\n' ',')"
          IFS=,
          for url in $urls; do
            # Strip whitespace; xargs mangles URLs with special chars.
            url="$(printf '%s' "$url" | tr -d '[:space:]')"
            [ -z "$url" ] && continue
            status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$url")
            case "$status" in
              200|202|204|409) echo "Portainer webhook OK: $url ($status)" ;;
              *) echo "Portainer webhook failed: $url ($status)" ; exit 1 ;;
            esac
          done
