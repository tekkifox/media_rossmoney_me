name: Build and Publish Monitoring Images

on:
  push:
    branches:
      - main
    paths:
      - 'monitoring/**'
      - '.github/workflows/monitoring-publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dashboard
            context: ./monitoring/dashboard
            file: ./monitoring/dashboard/Dockerfile
          - name: lynis-report-converter
            context: ./monitoring/lynis
            file: ./monitoring/lynis/Dockerfile
          - name: trivy
            context: ./monitoring/trivy
            file: ./monitoring/trivy/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/monitoring-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy ${{ matrix.stack }}
    runs-on: [self-hosted, paseo]
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { stack: monitoring, compose: deploy/monitoring.default.yml }
          - { stack: storage-monitoring, compose: deploy/monitoring.edge.yml }
          - { stack: photos-monitoring, compose: deploy/monitoring.edge.yml }
          - { stack: trivy, compose: deploy/trivy.default.yml }
          - { stack: storage-trivy, compose: deploy/trivy.default.yml }
          - { stack: photos-trivy, compose: deploy/trivy.photos.yml }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Redeploy stack via Portainer API
        shell: bash
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          STACK_NAME: ${{ matrix.stack }}
          COMPOSE_FILE: ${{ matrix.compose }}
        run: |
          set -euo pipefail

          PORTAINER_URL="${PORTAINER_URL%/}"

          # 1. Find the stack by exact name (never hardcode Id/EndpointId).
          stacks_response=$(curl -sS -w "\n%{http_code}" \
            -H "X-API-Key: ${PORTAINER_API_KEY}" \
            "${PORTAINER_URL}/api/stacks")
          stacks_status=$(printf '%s\n' "$stacks_response" | tail -n 1)
          stacks_body=$(printf '%s\n' "$stacks_response" | sed '$d')

          if [ "$stacks_status" -lt 200 ] || [ "$stacks_status" -ge 300 ]; then
            echo "Portainer GET /api/stacks failed with HTTP status ${stacks_status}"
            printf '%s\n' "$stacks_body"
            exit 1
          fi
          if ! printf '%s\n' "$stacks_body" | jq -e 'type == "array"' >/dev/null 2>&1; then
            echo "Portainer GET /api/stacks did not return a JSON array"
            printf '%s\n' "$stacks_body"
            exit 1
          fi

          matches=$(printf '%s\n' "$stacks_body" | jq -c --arg name "$STACK_NAME" '[.[] | select(.Name == $name)]')
          match_count=$(printf '%s\n' "$matches" | jq 'length')

          if [ "$match_count" -eq 0 ]; then
            echo "Portainer stack named '${STACK_NAME}' not found in /api/stacks"
            printf '%s\n' "$stacks_body"
            exit 1
          fi
          if [ "$match_count" -gt 1 ]; then
            echo "Portainer has ${match_count} stacks named '${STACK_NAME}'; refusing to guess. needs-decision:"
            printf '%s\n' "$matches" | jq -r '.[] | "  Id=\(.Id) EndpointId=\(.EndpointId) Name=\(.Name)"'
            exit 1
          fi

          stack_id=$(printf '%s\n' "$matches" | jq -r '.[0].Id // empty')
          endpoint_id=$(printf '%s\n' "$matches" | jq -r '.[0].EndpointId // empty')
          if [ -z "$stack_id" ] || [ "$stack_id" = "null" ]; then
            echo "Portainer stack '${STACK_NAME}' has no Id"
            printf '%s\n' "$matches"
            exit 1
          fi
          if [ -z "$endpoint_id" ] || [ "$endpoint_id" = "null" ]; then
            echo "Portainer stack '${STACK_NAME}' has no EndpointId"
            printf '%s\n' "$matches"
            exit 1
          fi

          echo "Found stack '${STACK_NAME}': Id=${stack_id}, EndpointId=${endpoint_id}"

          # 2. Read the live stack's Env (must be preserved; empty wipes all vars).
          get_response=$(curl -sS -w "\n%{http_code}" \
            -H "X-API-Key: ${PORTAINER_API_KEY}" \
            "${PORTAINER_URL}/api/stacks/${stack_id}")
          get_status=$(printf '%s\n' "$get_response" | tail -n 1)
          get_body=$(printf '%s\n' "$get_response" | sed '$d')

          if [ "$get_status" -lt 200 ] || [ "$get_status" -ge 300 ]; then
            echo "Portainer GET /api/stacks/${stack_id} failed with HTTP status ${get_status}"
            printf '%s\n' "$get_body"
            exit 1
          fi

          env_array=$(printf '%s\n' "$get_body" | jq -c '.Env // []')

          # 3. Update the stack with the new compose, preserved Env, and pull images.
          body=$(jq -n \
            --rawfile compose "$COMPOSE_FILE" \
            --argjson env "$env_array" \
            '{StackFileContent: $compose, Env: $env, PullImage: true}')

          put_response=$(curl -sS -w "\n%{http_code}" \
            -X PUT "${PORTAINER_URL}/api/stacks/${stack_id}?endpointId=${endpoint_id}" \
            -H "X-API-Key: ${PORTAINER_API_KEY}" \
            -H "Content-Type: application/json" \
            --data-binary "$body")
          put_status=$(printf '%s\n' "$put_response" | tail -n 1)
          put_body=$(printf '%s\n' "$put_response" | sed '$d')

          if [ "$put_status" -lt 200 ] || [ "$put_status" -ge 300 ]; then
            echo "Portainer PUT /api/stacks/${stack_id} failed with HTTP status ${put_status}"
            printf '%s\n' "$put_body"
            exit 1
          fi

          echo "Redeployed stack '${STACK_NAME}' (Id=${stack_id}) on endpoint ${endpoint_id} (HTTP ${put_status})"
