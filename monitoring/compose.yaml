# Report dashboard. See monitoring/README.md.
#
#   docker compose -f docker-compose.monitoring.yml up -d
#
# Environment variables are loaded from monitoring.env (or .env in the same dir).
# In Portainer, deploy the stack with this file alongside the compose file, or
# paste the values into the stack's Environment variables section.
#   docker compose --env-file monitoring.env -f docker-compose.monitoring.yml up -d

services:
  # Renders lynis-report.dat into HTML. One-shot; the host cron re-runs it daily.
  lynis-report-converter:
    image: ghcr.io/${IMAGE_NAMESPACE:-tekkifox}/lynis-report-converter:latest
    pull_policy: always
    user: "1001:1001"
    env_file:
      - monitoring.env
    volumes:
      - monitoring-reports:/reports
    depends_on:
      reports-init:
        condition: service_completed_successfully
    networks:
      - monitor
    restart: "no"

  # Chowns the report volume to 1001:1001. Docker creates named volumes
  # root-owned, so this must run before the scanner writes or nginx reads.
  # Uses the dashboard image which bundles the reports-init script; no separate
  # alpine image needed.
  reports-init:
    image: ghcr.io/${IMAGE_NAMESPACE:-tekkifox}/monitoring-dashboard:latest
    user: "0:0"
    entrypoint: ["/reports-init.sh"]
    env_file:
      - monitoring.env
    volumes:
      - monitoring-reports:/reports
    command: []
    restart: "no"

  # nginx runs as 1001:1001 to match the report ownership, so group-read bits
  # suffice. Port 8083 is unprivileged; tmpfs covers the paths nginx writes to.
  dashboard:
    image: ghcr.io/${IMAGE_NAMESPACE:-tekkifox}/monitoring-dashboard:latest
    pull_policy: always
    user: "1001:1001"
    env_file:
      - monitoring.env
    tmpfs:
      - /var/cache/nginx:uid=1001,gid=1001,mode=0700
      - /var/run:uid=1001,gid=1001,mode=0755
      - /tmp:uid=1001,gid=1001,mode=1777
    depends_on:
      reports-init:
        condition: service_completed_successfully
      lynis-report-converter:
        condition: service_completed_successfully
    volumes:
      - monitoring-reports:/reports:ro
    expose:
      - "8083"
    networks:
      proxy:
        ipv4_address: 172.18.0.22
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8083/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  monitor:
    driver: bridge
  # Created by the reverse proxy stack, which owns the subnet.
  proxy:
    external: true
    name: proxy

volumes:
  # Created by whichever writer runs first, then chowned by reports-init.
  monitoring-reports:
    name: rossmoney_monitoring-reports