server {
    listen 8083;
    server_name _;

    # /reports is the volume mount point, deliberately not /usr/share/nginx/html:
    # Docker seeds a fresh named volume from the image's mount point, so mounting
    # over the html directory copies nginx's stock index.html into the volume, and
    # the index module would then serve it at / instead of the report listing.
    root /reports;

    # The reverse proxy reaches this container on 172.18.0.22:8083 but the
    # browser must stay on the public host. Without these, nginx rewrites its
    # directory redirects (autoindex links, missing trailing slash) to an
    # absolute URL carrying its own :8083 and the browser is bounced out to
    # the unexposed container port.
    absolute_redirect off;
    port_in_redirect off;
    server_tokens off;

    charset utf-8;
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;

    # Reports are regenerated on every sweep; never let them cache.
    add_header Cache-Control "no-store, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Static file serving only. `try_files $uri $uri/` is deliberately NOT
    # used: for `GET /` it resolves to `//`, which nginx normalises with a
    # 301 back to an absolute URL carrying its own :8083. Plain root +
    # autoindex serves files and lists directories with no redirect at all.
    location / {
        autoindex on;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}