# The Trivy server is long-running so the API is always available.
# Scans are triggered on a host cron (see monitoring/trivy/trivy-cron.sh)
# rather than as a one-shot compose service, so no `scan` job here.

services:
  docker-api:
    image: lscr.io/linuxserver/socket-proxy:latest
    pull_policy: always
    container_name: trivy-docker-api
    env_file:
      - trivy.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /run
    networks:
      - trivy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:2375/_ping | grep -q OK
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
  trivy:
    image: ghcr.io/${IMAGE_NAMESPACE:-tekkifox}/monitoring-trivy:latest
    container_name: trivy
    pull_policy: always
    user: 1001:1001
    command:
      - server
      - --listen=0.0.0.0:8080
      - --cache-dir=/var/cache/trivy
      - --no-progress
      - --quiet
    env_file:
      - trivy.env
    volumes:
      - trivy-db:/var/cache/trivy
      # Host filesystem, used for OS package and secret scanning
      - /:/host:ro
      - monitoring-reports:/reports
    expose:
      - "8080"
    # Hard cap; honoured by Compose v2 without swarm. Keeps the server from
    # saturating the host. (One-shot scans inherit these via `docker exec`.)
    deploy:
      resources:
        limits:
          cpus: ${TRIVY_CPUS:-2.0}
          memory: ${TRIVY_MEMORY:-2G}
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - trivy
        - --version
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      docker-api:
        condition: service_healthy
    networks:
      - trivy

networks:
  trivy:
    driver: bridge

volumes:
  trivy-db:
    name: rossmoney_trivy-db
  monitoring-reports:
    external: true
    name: rossmoney_monitoring-reports